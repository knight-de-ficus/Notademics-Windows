<aside class="docs-sidebar" aria-label="文档目录">
  <div class="sidebar-inner">
    <p class="sidebar-label">文档</p>
    <nav class="sidebar-nav">
      {% for item in site.data.navigation %}
        {% assign item_url = item.url | relative_url %}
        <a href="{{ item_url }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>
          <span>{{ item.title }}</span>
          <span aria-hidden="true">›</span>
        </a>
      {% endfor %}
    </nav>
    <div class="sidebar-group">
      <p class="sidebar-label">资源</p>
      <a href="{{ site.release_url }}">下载最新版本</a>
      <a href="{{ site.repository_url }}/issues">问题反馈</a>
      <a href="{{ site.repository_url }}">源代码</a>
    </div>
  </div>
</aside>
