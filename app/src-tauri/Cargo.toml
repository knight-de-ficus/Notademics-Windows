[package]
name = "notademics"
version = "0.2.0"
description = "Notademics — The Art of Minimal Markdown"
license = "GPL-3.0-only"
authors = ["Notademics"]
edition = "2021"
# Disable auto-discovery of bins so Cargo only produces the explicit
# [[bin]] below (instead of also building an implicit "notademics" binary).
autobins = false

# Force the binary name to "Notademics" so it matches tauri.conf.json's
# `mainBinaryName` and the NSIS shortcuts point to the right executable.
[[bin]]
name = "Notademics"
path = "src/main.rs"

[lib]
name = "notademics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File encoding detection (BOM / GBK / UTF-8 …) for plain-text files
chardetng = "0.1"
encoding_rs = "0.8"
# Directory traversal for the file tree
walkdir = "2"
# File watching for external changes (tab reload)
notify = "8"
notify-debouncer-mini = "0.7"
# Move files to the OS recycle bin instead of hard-deleting
trash = "5"
# Windows 注册表访问（系统字体枚举）；版本对齐依赖树中已有的 0.55，避免重复引入
winreg = "0.55"
# 轻量正则（文件夹内搜索用）
regex-lite = "0.1"
